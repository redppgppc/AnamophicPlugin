; 콘텐츠가 3500~5600 cm 에 놓여 경계를 걸친다. 볼륨 밖의 lit translucent 표면은
; 조명을 못 받아 평평한 회색이 된다 (에디터에서 가까이 보면 멀쩡해서 안 보이는 함정).
; 원인이 확정되면 머티리얼을 Opaque 로 바꾸고 이 줄은 지운다.
