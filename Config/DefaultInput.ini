[/Script/Engine.InputSettings]
; VP template default was True; that draws VCam virtual joysticks on top of the nDisplay output
bAlwaysShowTouchInterface=False
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Legacy axis mappings for the engine DefaultPawn (WASD/QE fly, no rotation).
; The VP template ships none, so the pawn could not move at all.
; Mouse look is deliberately unbound: with "follow player camera" on, the rig
; follows the camera, so any stray mouse delta spins the whole wall view. The
; window is created off-centre and moved, which produces exactly such a delta on
; first focus. To steer, bind Turn to a key or gamepad axis here, never MouseX.
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveUp_World",Scale=1.0,Key=E)
+AxisMappings=(AxisName="MoveUp_World",Scale=-1.0,Key=Q)