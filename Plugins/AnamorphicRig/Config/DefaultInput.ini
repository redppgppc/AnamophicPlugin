; 이 파일은 플러그인이 호스트 프로젝트에 물려주는 입력 설정이다.
; 엔진이 플러그인의 Config 폴더 안 .ini 를 찾아 프로젝트 설정 계층에 레이어로 끼운다
; (ConfigCacheIni.cpp:7222 AddPluginsToBranches). 엔진 플러그인 중에도 같은 방식을 쓰는
; 예가 있다 (Plugins/VirtualProduction/Rivermax/RivermaxMedia/Config/DefaultEngine.ini).

[/Script/Engine.InputSettings]
; nDisplay 의 inputSyncPolicy(ReplicatePrimary)를 읽는 주체가 이 클래스다.
; EnhancedPlayerInput 이면 그 설정이 통째로 무시되어 포커스 있는 창만 움직이고
; 나머지 노드는 제자리라 벽이 어긋난다.
; UDisplayClusterPlayerInput 은 UEnhancedPlayerInput 을 상속하므로 기능 손실은 없다.
;
; 주의: 이 값은 배열이 아니라 단일 키다. 호스트 프로젝트의 Config/DefaultInput.ini 가
; 이 값을 명시하면 프로젝트가 이긴다 (VP 템플릿이 실제로 EnhancedPlayerInput 을 명시한다).
; 그래서 '형상 점검' 이 실제로 뭐가 적용됐는지 확인해 준다.
DefaultPlayerInputClass=/Script/DisplayCluster.DisplayClusterPlayerInput

; 엔진 DefaultPawn 이 쓰는 구식 축 매핑. WASD/QE 이동만 준다.
; 배열이라 호스트 프로젝트 것과 더해진다.
;
; 마우스 룩은 일부러 안 넣는다. '플레이어 카메라 따라가기' 를 켜면 DCRA 가 카메라의
; 위치와 회전을 매 틱 통째로 복사하므로 (DisplayClusterRootActor.cpp:1170) 마우스가
; 조금만 움직여도 벽 화면이 통째로 돈다. 방향 전환이 필요하면 키나 게임패드 축에 붙일 것.
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveUp_World",Scale=1.0,Key=E)
+AxisMappings=(AxisName="MoveUp_World",Scale=-1.0,Key=Q)
